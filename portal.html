<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פורטל לקוח | Shatsky Eylon</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #1a1a1a;
    --gray-dark: #3a3a3a;
    --gray-mid: #888;
    --gray-light: #e8e6e2;
    --gray-bg: #f5f4f0;
    --white: #ffffff;
    --beige: #f0ece4;
    --accent: #c8a882;
    --accent-hover: #b89060;
  }
  body {
    font-family: 'Assistant', sans-serif;
    background: var(--white);
    color: var(--black);
    font-size: 15px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  header {
    background: var(--beige);
    padding: 0 40px;
    border-bottom: 0.5px solid #d8d2c8;
  }
  .header-top {
    display: flex; align-items: center; justify-content: center;
    padding: 28px 0 8px;
  }
  .logo-mark-img { height: 64px; width: auto; display: block; }
  .header-body { padding: 8px 0 28px; text-align: center; }
  .header-body h1 {
    font-size: 13px; font-weight: 400; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--gray-mid); margin-bottom: 2px;
  }

  /* LOGIN */
  #login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 130px);
    padding: 40px 20px;
  }
  .login-box {
    width: 100%; max-width: 380px;
    background: var(--gray-bg);
    border: 0.5px solid var(--gray-light);
    padding: 40px 36px;
    text-align: center;
  }
  .login-box h2 {
    font-size: 18px; font-weight: 500; margin-bottom: 6px;
  }
  .login-box p {
    font-size: 13px; color: var(--gray-mid); margin-bottom: 28px;
  }
  .login-box input {
    width: 100%; padding: 12px 16px;
    border: 0.5px solid var(--gray-light);
    background: var(--white);
    font-family: 'Assistant', sans-serif;
    font-size: 15px; color: var(--black);
    outline: none; margin-bottom: 12px;
    text-align: center; letter-spacing: 0.1em;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 13px;
    background: var(--black); color: var(--white);
    border: none; cursor: pointer;
    font-family: 'Assistant', sans-serif;
    font-size: 14px; font-weight: 500; letter-spacing: 0.08em;
    transition: background 0.15s;
  }
  .login-btn:hover { background: var(--gray-dark); }
  .login-error {
    display: none; margin-top: 12px;
    font-size: 13px; color: #c0392b;
  }

  /* PORTAL */
  #portal-screen { display: none; padding: 60px 20px; }
  .portal-wrap { max-width: 680px; margin: 0 auto; }
  .portal-greeting {
    text-align: center; margin-bottom: 48px;
  }
  .portal-greeting h2 {
    font-size: 22px; font-weight: 400; margin-bottom: 6px;
  }
  .portal-greeting p {
    font-size: 13px; color: var(--gray-mid);
  }
  .portal-cards {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  }
  @media (max-width: 520px) {
    .portal-cards { grid-template-columns: 1fr; }
  }
  .portal-card {
    display: block; text-decoration: none;
    background: var(--gray-bg);
    border: 0.5px solid var(--gray-light);
    padding: 36px 28px;
    transition: border-color 0.15s, box-shadow 0.15s;
    text-align: center;
  }
  .portal-card:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }
  .card-icon { font-size: 32px; margin-bottom: 14px; }
  .card-title {
    font-size: 16px; font-weight: 500; color: var(--black);
    margin-bottom: 6px;
  }
  .card-desc { font-size: 13px; color: var(--gray-mid); }
  .logout-btn {
    display: block; margin: 48px auto 0;
    background: none; border: none; cursor: pointer;
    font-family: 'Assistant', sans-serif;
    font-size: 13px; color: var(--gray-mid);
    text-decoration: underline;
  }
  .logout-btn:hover { color: var(--black); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <img class="logo-mark-img" src="https://shatskyeylon1.github.io/se-client-brief/logo.png" alt="Shatsky Eylon" onerror="this.style.display='none'">
  </div>
  <div class="header-body">
    <h1>SHATSKY EYLON · CLIENT PORTAL</h1>
  </div>
</header>

<div id="login-screen">
  <div class="login-box">
    <h2>כניסה לפורטל</h2>
    <p>הכניסו את הסיסמא האישית שקיבלתם</p>
    <input type="text" id="login-password" placeholder="סיסמא" autocomplete="off">
    <button class="login-btn" onclick="doLogin()">כניסה</button>
    <div class="login-error" id="login-error">סיסמא שגויה. נסו שוב.</div>
  </div>
</div>

<div id="portal-screen">
  <div class="portal-wrap">
    <div class="portal-greeting">
      <h2>שלום, <span id="client-name"></span></h2>
      <p>בחרו את הקובץ הרצוי</p>
    </div>
    <div class="portal-cards">
      <a id="card-questionnaire" href="#" class="portal-card">
        <div class="card-icon">📋</div>
        <div class="card-title">שאלון אפיון</div>
        <div class="card-desc">מלאו את פרטי הפרויקט והעדפות העיצוב</div>
      </a>
      <a id="card-budget" href="#" class="portal-card">
        <div class="card-icon">💰</div>
        <div class="card-title">ניהול תקציב</div>
        <div class="card-desc">עקבו אחר התקציב והתשלומים</div>
      </a>
    </div>
    <button class="logout-btn" onclick="doLogout()">יציאה</button>
  </div>
</div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzmEwhOcJvI_tEwsgzeAp71Io9GapDlVRuJanu3I_9GUpPYfdeHwB8qUxsYdUJOYx_vbA/exec';
var BASE_URL = 'https://shatskyeylon1.github.io/se-client-brief/';
var currentPassword = '';

document.getElementById('login-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

function doLogin() {
  var pass = document.getElementById('login-password').value.trim();
  if (!pass) return;
  fetch(SCRIPT_URL + '?type=questionnaire&password=' + encodeURIComponent(pass))
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res || res === null) {
        document.getElementById('login-error').style.display = 'block';
        return;
      }
      currentPassword = pass;
      document.getElementById('client-name').textContent = res.name || '';
      document.getElementById('card-questionnaire').href = BASE_URL + encodeURIComponent('שאלון לקוח - אפיון.html') + '?password=' + encodeURIComponent(pass);
      document.getElementById('card-budget').href = BASE_URL + encodeURIComponent('ניהול תקציב.html') + '?password=' + encodeURIComponent(pass);
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('portal-screen').style.display = 'block';
    })
    .catch(function() {
      document.getElementById('login-error').style.display = 'block';
    });
}

function doLogout() {
  currentPassword = '';
  document.getElementById('login-password').value = '';
  document.getElementById('login-error').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('portal-screen').style.display = 'none';
}
</script>
</body>
</html>
